    <script>
      // Defensively safeguard fetch against sandbox/iframe environments where fetch has only a getter
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;

          function getFetch() {
            return currentFetch;
          }
          function setFetch(fn) {
            currentFetch = fn;
          }

          // Walk up prototype chain and define both getter and setter wherever fetch is defined
          var p = window;
          while (p) {
            try {
              var desc = Object.getOwnPropertyDescriptor(p, 'fetch');
              if (desc && (desc.configurable || !desc.set)) {
                Object.defineProperty(p, 'fetch', {
                  get: getFetch,
                  set: setFetch,
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
            p = Object.getPrototypeOf(p);
          }

          // Ensure window and globalThis have both getter and setter
          try {
            Object.defineProperty(window, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (_) {}

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (_) {}

        // Suppress benign iframe WebSocket disconnection rejections
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var msg = event.reason.message || String(event.reason);
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
              event.preventDefault();
            }
          }
        });
      })();
    </script>
